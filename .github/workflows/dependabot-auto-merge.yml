name: Dependabot PRの自動マージ

# automergeラベルが付いていて、ビルドとテストがすべて通っているPRを
# 定期的にマージする。日本時間で毎日20時と、土日の12時に実行する。
on:
  schedule:
    # 毎日20:00 JST = 11:00 UTC
    - cron: '0 11 * * *'
    # 土日12:00 JST = 03:00 UTC（0=日曜, 6=土曜）
    - cron: '0 3 * * 0,6'
  workflow_dispatch: {}

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 平日の9時〜17時(JST)なら何もせず終了する
        id: guard
        run: |
          hour=$(TZ=Asia/Tokyo date +%-H)
          dow=$(TZ=Asia/Tokyo date +%u)  # 1=月曜 ... 7=日曜
          if [ "$dow" -le 5 ] && [ "$hour" -ge 9 ] && [ "$hour" -lt 17 ]; then
            echo "平日の9時〜17時(JST)のため、何もせず終了します"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: automergeラベルが付いたPRをマージ
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -e
          prs=$(gh pr list --label automerge --state open --json number -q '.[].number')
          if [ -z "$prs" ]; then
            echo "対象のPRはありません"
            exit 0
          fi
          for pr in $prs; do
            echo "=== PR #$pr を確認します ==="
            if gh pr checks "$pr"; then
              echo "チェックがすべて通っているためマージします"
              gh pr merge "$pr" --squash --delete-branch
            else
              echo "チェックが完了していないか失敗しているため、今回はスキップします"
            fi
          done
