version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # 小さな更新（マイナー・パッチ）はまとめて1つのPRにする
      minor-and-patch-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # 脆弱性の修正は別のグループとしてまとめて1つのPRにする
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # メジャー（1つ目の数字が上がる）更新はグループ化せず個別のPRのままにする
